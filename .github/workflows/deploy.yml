name: Deploy

# Builds the static site and uploads dist/ to Cloudflare Pages (direct upload).
# M1's daily data refresh will reuse this workflow via the schedule trigger.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Skip until Cloudflare secrets are set
        if: env.HAS_CLOUDFLARE != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; skipping deploy."
      - uses: actions/checkout@v7
        if: env.HAS_CLOUDFLARE == 'true'
      - uses: actions/setup-node@v7
        if: env.HAS_CLOUDFLARE == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: env.HAS_CLOUDFLARE == 'true'
      - run: npm run build
        if: env.HAS_CLOUDFLARE == 'true'
      - uses: cloudflare/wrangler-action@v4
        if: env.HAS_CLOUDFLARE == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=brewhunt --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
