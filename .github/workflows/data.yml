name: Data

# Daily refresh: fetch Homebrew's data, commit it to the `data` branch, then build and deploy
# the site with it. Homebrew's analytics for the previous day are out by early morning UTC.
on:
  schedule:
    - cron: '17 6 * * *'
    # Retry later in the day in case the morning run failed; an unchanged day commits nothing.
    - cron: '17 14 * * *'
  workflow_dispatch:

concurrency:
  group: data-refresh
  cancel-in-progress: false

permissions: {}

jobs:
  refresh:
    # Reads third-party taps (as text; nothing from them is executed), so this job gets no
    # write access and no secrets beyond the read-only GITHUB_TOKEN.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find previous data
        id: data
        # Only "no such branch" (exit 2) means a first run. Any other failure stops here: running
        # without the previous state would overwrite the branch's history with a fresh start.
        run: |
          status=0
          git ls-remote --exit-code --heads "https://github.com/$GITHUB_REPOSITORY" data > /dev/null || status=$?
          if [ "$status" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 2 ]; then
            echo "::notice::No data branch yet; this run starts it."
          else
            echo "::error::Couldn't check for the data branch (git exit $status)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.data.outputs.exists == 'true'
        with:
          ref: data
          path: data
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run the pipeline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/data/run.ts --data data --work "$RUNNER_TEMP/pipeline"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: data
          path: |
            data/state
            data/site
          retention-days: 3
          if-no-files-found: error

  publish:
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Switch to the data branch
        run: |
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch --depth=1 origin data
            git checkout -B data FETCH_HEAD
          else
            git checkout --orphan data
            git rm -rfq .
          fi
          rm -rf state site
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: data
          path: .
      - name: Commit if anything changed
        id: commit
        run: |
          cat > README.md <<'EOF'
          # Brewhunt data

          Written daily by `.github/workflows/data.yml` on `main`. Don't edit by hand.

          - `site/`: what the Astro build reads (packages, taps, history, meta).
          - `state/`: what the next run needs (dates per package, daily 30-day counts by month).
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -qm "Data for analytics ending $(jq -r .analytics.d30.end site/meta.json)"
            git push origin HEAD:refs/heads/data
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  site:
    needs: publish
    uses: ./.github/workflows/ci.yml
    with:
      data-ref: ${{ needs.publish.outputs.sha }}
    secrets: inherit
    permissions:
      contents: read
      deployments: write
