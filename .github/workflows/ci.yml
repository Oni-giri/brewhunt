name: CI

# Every push and PR is checked against the latest data on the `data` branch. Pushes to main
# (and manual runs on main) then upload dist/ to Cloudflare Pages (direct upload). The daily
# data workflow (data.yml) calls this with the data commit it just made.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      data-ref:
        description: Commit on the data branch to build with
        type: string
        required: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find data
        id: data
        env:
          DATA_REF: ${{ inputs.data-ref }}
        run: |
          if [ -n "$DATA_REF" ]; then
            echo "ref=$DATA_REF" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status=0
          git ls-remote --exit-code --heads "https://github.com/$GITHUB_REPOSITORY" data > /dev/null || status=$?
          if [ "$status" -eq 0 ]; then
            echo "ref=data" >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 2 ]; then
            echo "::error::No data branch: run the Data workflow first (the site can't build without data)."
            exit 1
          else
            echo "::error::Couldn't check for the data branch (git exit $status)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.data.outputs.ref != ''
        with:
          ref: ${{ steps.data.outputs.ref }}
          path: data
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm run validate:content
      - run: npm run build
      - name: Stay under Cloudflare Pages' file limit
        # The free plan allows 20,000 files per deployment.
        run: |
          files=$(find dist -type f | wc -l)
          echo "dist/ has $files files"
          if [ "$files" -gt 19000 ]; then
            echo "::error::dist/ has $files files; Cloudflare Pages (free) allows 20,000."
            exit 1
          fi
      # For the browser tests, and on main for the deploy.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 3
          if-no-files-found: error

  browser:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Find Playwright's version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Downloads Chromium unless cached; always installs the system libraries it needs.
      - run: npx playwright install --with-deps --only-shell chromium
      # The daily data run (data.yml passes data-ref) changes only data: it runs the checks new
      # data can break (layout and errors on every page type, accessibility, search speed).
      # Pushes and PRs run everything.
      - name: Browser tests
        env:
          DATA_RUN: ${{ inputs.data-ref != '' }}
        run: |
          if [ "$DATA_RUN" = "true" ]; then
            npm run test:browser -- layout a11y search-timing
          else
            npm run test:browser
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  deploy:
    needs: [check, browser]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: true
    permissions:
      contents: read
      deployments: write
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Skip until Cloudflare secrets are set
        if: env.HAS_CLOUDFLARE != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; skipping deploy."
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.HAS_CLOUDFLARE == 'true'
        with:
          name: dist
          path: dist
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        if: env.HAS_CLOUDFLARE == 'true'
        with:
          wranglerVersion: '4.153.0'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=brewhunt --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
