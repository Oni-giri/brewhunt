# Editorial fields per package, keyed by package id. See content/README.md.
#   name: a shorter display name than Homebrew's ("VLC" for "VLC media player").
#   tagline: one line (60 characters at most, no full stop) shown in lists instead of
#            Homebrew's description. Only add one where Homebrew's description is unclear.
#   developer: who makes it, for the app page's Information list.
#   keywords: lowercase search terms Homebrew's data doesn't link to the package (command
#             names, former names, common abbreviations). Homebrew already links formula
#             aliases (rg for ripgrep, nvim for neovim) and old cask tokens: don't repeat them.

