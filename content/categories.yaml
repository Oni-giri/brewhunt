# Categories, in display order. See content/README.md.
#
# A package can be in several categories; its first one in this file is its primary
# category (breadcrumbs, "Rank #n in …"). List the best-known packages first: the first
# few stand for the category in icon stacks and "Rectangle, AltTab, MonitorControl".
# Ids are Homebrew names: formula name, cask token (often not the app name: Ice is
# jordanbaird-ice) or owner/tap/name for community taps.

- slug: windows-desktop
  name: Windows & desktop
  description: Snap, tile and switch windows, and get more out of your displays.
  tile: blue
  subcategories:
    - { slug: snapping, name: Snapping }
    - { slug: tiling, name: Tiling }
    - { slug: switching, name: Switching }
    - { slug: displays, name: Displays }
  packages:
    - { id: rectangle, sub: snapping }
    - { id: alt-tab, sub: switching }
    - { id: monitorcontrol, sub: displays }
    - { id: nikitabobko/tap/aerospace, sub: tiling }
    - { id: amethyst, sub: tiling }
    - { id: betterdisplay, sub: displays }
    - { id: loop, sub: snapping }
    - { id: rectangle-pro, sub: snapping }
    - { id: moom, sub: snapping }
    - { id: swish, sub: snapping }
    - { id: lunar, sub: displays }
    - { id: dockdoor, sub: switching }
    - { id: contexts, sub: switching }
