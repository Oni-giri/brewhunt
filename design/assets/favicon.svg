    <path d="M3 17.6 C5 14.2 7.6 14.4 9 15.4 C10.6 13.2 13.8 13.2 15.2 15 C16.8 13.4 19.8 13.8 20.8 15.6 C22.4 14.8 24.6 15.6 25 17.4 L25 18.6 C21 19.6 18 17.8 14 18.6 C10 19.4 7 19.4 3 18.6 Z" fill="#FFFFFF"/>
